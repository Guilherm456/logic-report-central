<div class="flex flex-col h-[calc(100dvh-63px)] md:h-screen bg-white relative">
  <div class="w-full py-4 px-6 border-b border-gray-200">
    <div class="max-w-[500px] w-full mx-auto">
      <h2 class="text-xl font-semibold text-gray-800 text-left">
        {{ header }}
      </h2>
      <p class="text-sm text-gray-500 text-left">
        {{ description }}
      </p>
    </div>
  </div>

  <div
    class="mx-auto overflow-y-auto h-full p-6 md:px-1 max-w-[500px] w-full flex flex-col gap-2"
  >
    <ng-content></ng-content>
  </div>

  <div
    class="absolute bottom-0 left-0 right-0 p-4 bg-gray-50 border-t border-gray-200 flex justify-between items-center"
  >
    <app-button
      type="button"
      className="bg-gray-100 hover:bg-gray-200 !text-gray-700"
      (click)="handleCancel.emit()"
      [disabled]="loading"
      id="cancel-button"
    >
      {{ cancelText }}
    </app-button>

    <app-button
      type="submit"
      [loading]="loading"
      id="submit-button"
      (click)="handleSave.emit()"
    >
      <span class="material-icons-outlined text-base mr-1">save</span>
      {{ submitText }}
    </app-button>
  </div>
</div>
